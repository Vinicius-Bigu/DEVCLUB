

<!-- Listas -->


<!--..Listas ordenadas e não ordenadas-->
<!--..Listas ordenadas são criadas usando a tag <ol> (ordered list) e cada item da lista é definido usando a tag <li> (list item)-->
<!--..Listas não ordenadas são criadas usando a tag <ul> (unordered list) e cada item da lista é definido usando a tag <li> (list item)-->

<h2>4 Série B</h2>
    <!--exemplo de lista ordenada:-->
<ol>
    <li>Ana</li>
    <li>Bia</li>
    <li>Carla</li>
</ol>
<br>
 <h2>5 Série B</h2>
<!--exemplo de lista não ordenada:-->
<ul>
    <li>João</li>
    <li>Maria</li>
    <li>Pedro</li>
</ul>
