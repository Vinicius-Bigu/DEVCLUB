

<!-- Imagens -->

<!-- A tag <img> é usada para inserir uma imagem em uma página HTML. Ela é um elemento vazio, o que significa que não tem uma tag de fechamento. -->
<!-- O atributo src é usado para especificar a fonte da imagem, ou seja, o caminho para o arquivo de imagem que você deseja exibir. -->
<!-- O atributo alt é usado para fornecer um texto alternativo para a imagem, que é exibido caso a imagem não possa ser carregada ou para leitores de tela. -->

<!-- Exemplo: -->
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPdPbaY8Zm-DewEjLF_tIZA_r6yms7WNppJQ&s" alt="Imagem de exemplo">

<!-- O atributo width é usado para especificar a largura da imagem em pixels ou em porcentagem. -->
<!-- Exemplo: -->
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPdPbaY8Zm-DewEjLF_tIZA_r6yms7WNppJQ&s" alt="Imagem de exemplo" width="300">

<!-- O atributo height é usado para especificar a altura da imagem em pixels ou em porcentagem. -->
<!-- Exemplo: -->
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPdPbaY8Zm-DewEjLF_tIZA_r6yms7WNppJQ&s" alt="Imagem de exemplo" height="200">

<!-- O atributo style pode ser usado para aplicar estilos CSS diretamente à imagem, como bordas, margens, etc. -->
<!-- Exemplo: -->
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPdPbaY8Zm-DewEjLF_tIZA_r6yms7WNppJQ&s" alt="Imagem de exemplo" style="border: 2px solid black; margin: 10px;">
