


<!-- Navegando entre pastas -->
<!-- Para navegar entre pastas, utilizamos os seguintes símbolos: -->

<!-- Para acessar uma pasta específica, utilizamos o nome da pasta seguido de uma barra (/) -->
<!-- Exemplo: -->
<img src="/imagem.png" alt="Imagem na pasta raiz">

<!-- Acessando uma imagem em uma subpasta -->
 <!-- Exemplo: -->
<img src="./img/devclub/devclub.png">


<!-- Para acessar uma pasta anterior, utilizamos dois pontos (..) seguidos de uma barra (/) -->
<!-- Exemplo: -->
<img src="../imagens/imagem.png" alt="Imagem na pasta imagens">

<!-- Para acessar uma pasta anterior à pasta anterior, utilizamos dois pontos (..) seguidos de uma barra (/) novamente -->
<!-- Exemplo: -->
<img src="../../imagens/imagem.png" alt="Imagem na pasta anterior">
