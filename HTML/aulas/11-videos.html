<!-- Videos em HTML-->

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML</title>
</head>

<body>
    <h1>Vídeos em HTML</h1>

    <!-- Para inserir um vídeo em HTML, utilizamos a tag <video> -->
    <!-- A tag <video> possui os seguintes atributos: -->
    <!-- src: especifica o caminho do arquivo de vídeo -->
    <!-- controls: exibe os controles de reprodução do vídeo -->
    <!-- autoplay: inicia a reprodução do vídeo automaticamente -->
    <!-- loop: faz com que o vídeo seja reproduzido em loop -->
    <!-- muted: silencia o áudio do vídeo -->
    <!-- Exemplo de um vídeo que inicia automaticamente e é reproduzido em loop -->

    <!-- Exemplo de um vídeo com controles e autoplay -->
    <video src="./Videos/world-war-craft.mp4" height="500" width="700" 
        controls
        controlslist="nodownload"
        muted
        poster="./Pictures/war-craft.avif"
        autoplay>
    </video>
    
</body>
</html>
