
<!-- Link -->

<!-- A tag <a> é usada para criar um link em HTML. Ela é um elemento de ancoragem que permite aos usuários clicar em um texto ou imagem para navegar para outra página ou recurso. -->
<!--A tag href é usada para especificar o destino do link-->   
<!--Exemplo:-->
    <a href="https://www.google.com">Clique em mim</a>
<br>
<!-- O atributo target é usado para especificar onde o link deve ser aberto. O valor "_blank" abre o link em uma nova aba ou janela do navegador. -->
<!--Exemplo:-->
    <a href="https://www.google.com" target="_blank">Clique em mim</a>
<br>
<!--O atributo mailto é usado para criar um link que abre o cliente de e-mail padrão do usuário -->
<!--Exemplo:-->
<a href="mailto:suporte@rodolfomori.com">Envie um e-mail</a>
<br>
<!--O atributo tel é usado para criar um link que permite aos usuários fazer uma chamada telefônica diretamente do navegador -->
<!--Exemplo:-->
<a href="tel:+5511999999999">Ligue para nós</a>
<br>
<!--O atributo ./ é usado para especificar um caminho relativo para um arquivo local -->
<!--Exemplo:-->
<a href="./teste.html">Vamos para a página de teste</a>
<br>
<!--O atributo # é usado para criar um link para uma seção específica dentro da mesma página -->
<!--Exemplo:-->
<a href="#topo">Vá para o topo</a>  
<a href="#final">Vá para o final</a>
