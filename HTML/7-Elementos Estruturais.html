

<!-- Elementos Estruturais -->


     <!-- A tag <div> é usada para criar seções em um documento HTML -->
     <!-- Ela é um elemento de contêiner genérico que pode ser usado para agrupar outros elementos HTML e aplicar estilos ou scripts a eles -->
        <!-- Exemplo: -->
<div>
    <h1>Este é um título dentro de uma div</h1>
    <p>Este é um parágrafo dentro de uma div</p>
</div>
<br>
     <!-- A tag <span> é usada para aplicar estilos ou scripts a uma parte específica do texto dentro de um elemento HTML -->
     <!-- Ela é um elemento de contêiner genérico que não tem significado semântico, mas pode ser útil para aplicar estilos ou scripts a partes específicas do texto -->
        <!-- Exemplo: -->
<p>Este é um parágrafo com um <span style="color: red;">texto em vermelho</span> usando a tag span.</p>
