<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" />
    <title>DevClub - Convert Money</title>
</head>

<body>
    <header>
        <img src="./../img/logo.gif" alt="Logo-convert-money" />
    </header>
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select>
                <option>US$ Dólar Americano</option>
                <option>€ Euro</option>
            </select>
        </label>
        Valor
        <input placeholder="R$ 10.000,00" </input>

        <button>Converter</button>

        <section>
            <div>
                <img src="./../img/brasil 2.png" alt="logo-moeda-a-converter" />
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>

            <img src="./../img/Vector@2x.png" alt="arrow" />

            <div>
                <img src="./../img/estados-unidos (1) 1.png" alt="logo-moeda-convertida" />
                <p>Dólar</p>
                <p>US$ 0,00</p>
            </div>
        </section>
    </main>
</body>

</html>
