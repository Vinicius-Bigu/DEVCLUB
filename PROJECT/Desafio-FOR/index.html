<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>

<body>
    <input placeholder="Digite o nome do contato">
    <p></p>
    <button onclick="search()">Procura Contato</button>
</body>
<script>
    let p = document.querySelector('p')
    let input = document.querySelector('input')

    const contacts = [
        { name: 'João', phone: '123456789' },
        { name: 'Maria', phone: '987654321' },
        { name: 'Pedro', phone: '555555555' },
    ]
    function search() {
     for(let i = 0; i < contacts.length; i++) {

            if(input.value.toLowerCase() === contacts[i].name.toLowerCase()){
                p.innerHTML = `Contato Encontrado Nome: ${contacts[i].name} Telefone: ${contacts[i].phone}`
                break
            }
            else {
                p.innerHTML = "Contato não encontrado, tente novamente"
            }
            }
        }
</script>

</html>
