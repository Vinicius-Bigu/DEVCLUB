<!--TIPO DO DOCUMENTO-->
<!doctype html>
<html lang="pt-br">
  <!--CABEÇALHO DO DOCUMENTO AQUI VÃO AS CONFIGURAÇÕES-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <title>Treinando com IA</title>
  </head>

  <!--CORPO PRINCIPAL DO SITE, TUDO QUE FOR VISIVEL-->
  <body>
    <!--CABEÇALHO DO SITE-->
    <header>
      <h1>Treinando com IA</h1>
      <img src="./../../../img/Gemini_Generated_Image_ivb9naivb9naivb9.png" alt="Logo do Treinando com IA" class="logo">
      <!--MENU DE NAVEGAÇÃO-->
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Contato</a></li>
          <li><a href="#">Serviços</a></li>
          <li><a href="#">Produtos</a></li>
        </ul> <!--FIM DO MENU DE NAVEGAÇÃO-->

        <!--AREA DE LOGIN-->
        <form action="#" method="post">
          <label for="login">Login:</label><br />
          <input
            type="text"
            name="login"
            id="login"
            required
            placeholder="Digite seu login"
          /><br /><br />

          <label for="password">Senha:</label><br />
          <input
            type="password"
            name="password"
            id="password"
            required
            placeholder="Digite sua Senha"
          /><br /><br />
          <button type="submit">Entrar</button>
          <button type="reset">Limpar</button>
        </form> <!--FIM DA AREA DE LOGIN-->
      </nav>
    </header>
    <!--CONTEÚDO DO SITE-->
    <main>
      <article>
        <h2>Área de Suporte</h2>
        <p>
          Nos envie uma mensagem e nossa equipe de suporte responderá em breve.
        </p>
      </article>

      <!-- FORMULARIO DE CADASTRO-->

      <form action="#" method="post">
        <!-- Campo Nome -->
        <label for="nome">Nome:</label><br />
        <input
          type="text"
          id="nome"
          name="nome"
          required
          placeholder="Digite seu Nome"
        /><br /><br />

        <!--CAMPO DE EMAIL-->
        <label for="email">Email:</label><br />
        <input
          type="email"
          name="email"
          id="email"
          required
          placeholder="Digite seu Email"
        /><br /><br />

        <!--CAMPO DE TEXTO-->
        <label for="mensagem">Mensagem:</label><br />
        <textarea
          name="mensagem"
          id="mensagem"
          rows="4"
          placeholder="Digite sua Mensagem"
        ></textarea
        ><br /><br />

        <!--BOTAO DE ENVIAR-->
        <button type="submit">Enviar</button>
        <!--BOTAO DE LIMPAR-->
        <button type="reset">Limpar</button>
      </form> <!--FIM DO FORMULARIO DE CADASTRO-->
    </main>
    <footer>
      <p>Desenvolvido por Marcus Vinicius</p>
    </footer>
  </body>
</html>
